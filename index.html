
<style>

<div class="app">
<h2 class="sr-only">건강 지표 계산기 — 기본 정보를 입력하면 BMI·기초대사량·체지방률·혈압·칼로리 탭에 자동 반영</h2>

<div class="hero">
  <div class="hero-top">
    <div class="hero-icon"><i class="ti ti-heart" aria-hidden="true"></i></div>
    <div>
      <div class="hero-title">기본 정보</div>
      <div class="hero-sub">입력하면 모든 탭에 자동 반영돼요</div>
    </div>
  </div>
  <div class="hero-grid">
    <div class="hf">
      <div class="hf-label">성별</div>
      <div class="sex-row">
        <button class="sx on" id="g-male" onclick="setG('sex','male')">남성</button>
        <button class="sx" id="g-female" onclick="setG('sex','female')">여성</button>
      </div>
    </div>
    <div class="hf">
      <div class="hf-label">나이</div>
      <div class="hw"><input type="number" id="g-age" placeholder="30" min="10" max="120" oninput="syncAll()"><span class="hw-unit">세</span></div>
    </div>
    <div class="hf">
      <div class="hf-label">키</div>
      <div class="hw"><input type="number" id="g-h" placeholder="170" min="100" max="250" oninput="syncAll()"><span class="hw-unit">cm</span></div>
    </div>
    <div class="hf">
      <div class="hf-label">체중</div>
      <div class="hw"><input type="number" id="g-w" placeholder="65" min="20" max="300" oninput="syncAll()"><span class="hw-unit">kg</span></div>
    </div>
  </div>
  <div class="sync-note"><i class="ti ti-refresh" aria-hidden="true" style="font-size:13px"></i> 수치를 바꾸면 아래 결과가 바로 업데이트돼요</div>
</div>

<div class="tabs">
  <button class="tab t0 on" onclick="go(0)"><i class="ti ti-ruler-measure" aria-hidden="true" style="font-size:13px;margin-right:3px"></i>BMI</button>
  <button class="tab t1" onclick="go(1)"><i class="ti ti-flame" aria-hidden="true" style="font-size:13px;margin-right:3px"></i>기초대사량</button>
  <button class="tab t2" onclick="go(2)"><i class="ti ti-percentage" aria-hidden="true" style="font-size:13px;margin-right:3px"></i>체지방률</button>
  <button class="tab t3" onclick="go(3)"><i class="ti ti-activity" aria-hidden="true" style="font-size:13px;margin-right:3px"></i>혈압</button>
  <button class="tab t4" onclick="go(4)"><i class="ti ti-salad" aria-hidden="true" style="font-size:13px;margin-right:3px"></i>칼로리 목표</button>
</div>

<div id="p0" class="panel p0 on">
  <div id="r0"><div class="empty e0"><i class="ti ti-ruler-measure" style="font-size:20px;display:block;margin-bottom:6px" aria-hidden="true"></i>키와 체중을 입력해 보세요</div></div>
</div>

<div id="p1" class="panel p1">
  <div class="xrow">
    <div class="xf"><label>활동 수준</label><div class="xw"><select id="bmr-act" onchange="calcBMR()"><option value="1.2">거의 없음 (좌식)</option><option value="1.375">가벼운 활동 (주 1~3회)</option><option value="1.55" selected>보통 (주 3~5회)</option><option value="1.725">활동적 (주 6~7회)</option><option value="1.9">매우 활동적</option></select></div></div>
  </div>
  <div id="r1"><div class="empty e1"><i class="ti ti-flame" style="font-size:20px;display:block;margin-bottom:6px" aria-hidden="true"></i>기본 정보를 먼저 입력해 주세요</div></div>
</div>

<div id="p2" class="panel p2">
  <div id="r2"><div class="empty e2"><i class="ti ti-percentage" style="font-size:20px;display:block;margin-bottom:6px" aria-hidden="true"></i>기본 정보를 먼저 입력해 주세요</div></div>
</div>

<div id="p3" class="panel p3">
  <div class="xrow">
    <div class="xf"><label>수축기 혈압 (최고)</label><div class="xw"><input type="number" id="bp-sys" placeholder="120" min="60" max="250" oninput="calcBP()"><span class="xu">mmHg</span></div></div>
    <div class="xf"><label>이완기 혈압 (최저)</label><div class="xw"><input type="number" id="bp-dia" placeholder="80" min="40" max="150" oninput="calcBP()"><span class="xu">mmHg</span></div></div>
  </div>
  <div id="r3"><div class="empty e3"><i class="ti ti-activity" style="font-size:20px;display:block;margin-bottom:6px" aria-hidden="true"></i>혈압 수치를 입력해 주세요</div></div>
</div>

<div id="p4" class="panel p4">
  <div class="xrow">
    <div class="xf"><label>활동 수준</label><div class="xw"><select id="cal-act" onchange="calcCal()"><option value="1.2">거의 없음</option><option value="1.375">가벼운 활동</option><option value="1.55" selected>보통</option><option value="1.725">활동적</option><option value="1.9">매우 활동적</option></select></div></div>
    <div class="xf"><label>목표</label><div class="xw"><select id="cal-goal" onchange="calcCal()"><option value="0.8">감량 (–20%)</option><option value="0.9">점진적 감량 (–10%)</option><option value="1.0" selected>체중 유지</option><option value="1.1">점진적 증량 (+10%)</option><option value="1.15">근육 증량 (+15%)</option></select></div></div>
  </div>
  <div id="r4"><div class="empty e4"><i class="ti ti-salad" style="font-size:20px;display:block;margin-bottom:6px" aria-hidden="true"></i>기본 정보를 먼저 입력해 주세요</div></div>
</div>
</div>

<script>
let G={sex:'male'};
function go(i){
  document.querySelectorAll('.tab').forEach((b,j)=>b.classList.toggle('on',i===j));
  [0,1,2,3,4].forEach(j=>{document.getElementById('p'+j).classList.toggle('on',i===j)});
}
function setG(k,v){
  G[k]=v;
  if(k==='sex'){
    document.getElementById('g-male').classList.toggle('on',v==='male');
    document.getElementById('g-female').classList.toggle('on',v==='female');
  }
  syncAll();
}
function gv(id){return parseFloat(document.getElementById(id).value)||null;}
function syncAll(){
  G.age=gv('g-age');G.h=gv('g-h');G.w=gv('g-w');
  calcBMI();calcBMR();calcBF();calcCal();
}
function bmiCat(v){
  if(v<18.5)return{l:'저체중',c:'b-bl'};
  if(v<23)return{l:'정상',c:'b-gr'};
  if(v<25)return{l:'과체중',c:'b-am'};
  if(v<30)return{l:'비만 1단계',c:'b-re'};
  return{l:'비만 2단계+',c:'b-re'};
}
function calcBMI(){
  const el=document.getElementById('r0');
  const{h,w}=G;
  if(!h||!w){el.innerHTML='<div class="empty e0"><i class="ti ti-ruler-measure" style="font-size:20px;display:block;margin-bottom:6px" aria-hidden="true"></i>키와 체중을 입력해 보세요</div>';return;}
  const bmi=w/((h/100)**2),cat=bmiCat(bmi);
  const iMin=(18.5*(h/100)**2).toFixed(1),iMax=(22.9*(h/100)**2).toFixed(1);
  const pct=Math.min(Math.max((bmi-10)/40*100,2),98);
  const bc=bmi<18.5?'#378ADD':bmi<23?'#639922':bmi<25?'#BA7517':'#E24B4A';
  el.innerHTML=`<div class="rg">
    <div class="rc rc0"><div class="rc-lbl">BMI 수치</div><div class="rc-val">${bmi.toFixed(1)}</div><div class="rc-sub"><span class="badge ${cat.c}">${cat.l}</span></div><div class="bar-track"><div class="bar-fill" style="width:${pct.toFixed(0)}%;background:${bc}"></div></div></div>
    <div class="rc rc0"><div class="rc-lbl">정상 체중 범위</div><div class="rc-val" style="font-size:15px;margin-top:2px">${iMin}~${iMax} kg</div><div class="rc-sub">현재 ${w} kg</div></div>
  </div>
  <div class="guide g0"><div class="guide-hd"><i class="ti ti-info-circle" aria-hidden="true" style="font-size:13px;margin-right:4px"></i>아시아-태평양 기준</div>
    <div class="grow"><span class="badge b-bl" style="width:78px;text-align:center">저체중</span><span class="grow-r">18.5 미만</span></div>
    <div class="grow"><span class="badge b-gr" style="width:78px;text-align:center">정상</span><span class="grow-r">18.5 ~ 22.9</span></div>
    <div class="grow"><span class="badge b-am" style="width:78px;text-align:center">과체중</span><span class="grow-r">23.0 ~ 24.9</span></div>
    <div class="grow"><span class="badge b-re" style="width:78px;text-align:center">비만</span><span class="grow-r">25.0 이상</span></div>
  </div>`;
}
function calcBMR(){
  const el=document.getElementById('r1');
  const{age,h,w,sex}=G;
  if(!age||!h||!w){el.innerHTML='<div class="empty e1"><i class="ti ti-flame" style="font-size:20px;display:block;margin-bottom:6px" aria-hidden="true"></i>기본 정보를 먼저 입력해 주세요</div>';return;}
  const act=parseFloat(document.getElementById('bmr-act').value)||1.55;
  const bmr=sex==='male'?88.362+(13.397*w)+(4.799*h)-(5.677*age):447.593+(9.247*w)+(3.098*h)-(4.330*age);
  const tdee=bmr*act;
  el.innerHTML=`<div class="rg">
    <div class="rc rc1"><div class="rc-lbl">기초대사량 (BMR)</div><div class="rc-val">${Math.round(bmr).toLocaleString()}</div><div class="rc-sub">kcal / 일</div></div>
    <div class="rc rc1"><div class="rc-lbl">총 에너지 소비 (TDEE)</div><div class="rc-val">${Math.round(tdee).toLocaleString()}</div><div class="rc-sub">kcal / 일</div></div>
  </div>
  <div class="tip tip1"><i class="ti ti-bulb" aria-hidden="true" style="font-size:13px;margin-right:4px"></i>Harris-Benedict 공식 기반이에요. BMR은 안정 상태 최소 칼로리, TDEE는 활동량 반영 실제 소비량이에요.</div>`;
}
function calcBF(){
  const el=document.getElementById('r2');
  const{age,h,w,sex}=G;
  if(!age||!h||!w){el.innerHTML='<div class="empty e2"><i class="ti ti-percentage" style="font-size:20px;display:block;margin-bottom:6px" aria-hidden="true"></i>기본 정보를 먼저 입력해 주세요</div>';return;}
  const bmi=w/((h/100)**2),sv=sex==='male'?1:0;
  const bf=(1.20*bmi)+(0.23*age)-(10.8*sv)-5.4;
  let cat,cls;
  if(sex==='male'){if(bf<6){cat='필수 지방';cls='b-bl';}else if(bf<14){cat='운동선수 수준';cls='b-gr';}else if(bf<18){cat='건강 양호';cls='b-gr';}else if(bf<25){cat='허용 범위';cls='b-am';}else{cat='비만';cls='b-re';}}
  else{if(bf<14){cat='필수 지방';cls='b-bl';}else if(bf<21){cat='운동선수 수준';cls='b-gr';}else if(bf<25){cat='건강 양호';cls='b-gr';}else if(bf<32){cat='허용 범위';cls='b-am';}else{cat='비만';cls='b-re';}}
  const gd=sex==='male'?`<div class="grow"><span class="badge b-bl" style="width:88px;text-align:center">필수 지방</span><span class="grow-r">2~5%</span></div><div class="grow"><span class="badge b-gr" style="width:88px;text-align:center">운동선수</span><span class="grow-r">6~13%</span></div><div class="grow"><span class="badge b-gr" style="width:88px;text-align:center">건강 양호</span><span class="grow-r">14~17%</span></div><div class="grow"><span class="badge b-am" style="width:88px;text-align:center">허용 범위</span><span class="grow-r">18~24%</span></div><div class="grow"><span class="badge b-re" style="width:88px;text-align:center">비만</span><span class="grow-r">25% 이상</span></div>`:
  `<div class="grow"><span class="badge b-bl" style="width:88px;text-align:center">필수 지방</span><span class="grow-r">10~13%</span></div><div class="grow"><span class="badge b-gr" style="width:88px;text-align:center">운동선수</span><span class="grow-r">14~20%</span></div><div class="grow"><span class="badge b-gr" style="width:88px;text-align:center">건강 양호</span><span class="grow-r">21~24%</span></div><div class="grow"><span class="badge b-am" style="width:88px;text-align:center">허용 범위</span><span class="grow-r">25~31%</span></div><div class="grow"><span class="badge b-re" style="width:88px;text-align:center">비만</span><span class="grow-r">32% 이상</span></div>`;
  el.innerHTML=`<div class="rg">
    <div class="rc rc2"><div class="rc-lbl">체지방률</div><div class="rc-val">${bf.toFixed(1)}%</div><div class="rc-sub"><span class="badge ${cls}">${cat}</span></div></div>
    <div class="rc rc2"><div class="rc-lbl">BMI (자동 계산)</div><div class="rc-val">${bmi.toFixed(1)}</div><div class="rc-sub">kg/m²</div></div>
  </div>
  <div class="guide g2"><div class="guide-hd"><i class="ti ti-info-circle" aria-hidden="true" style="font-size:13px;margin-right:4px"></i>${sex==='male'?'남성':'여성'} 기준 (ACE)</div>${gd}</div>
  <div class="tip tip2"><i class="ti ti-bulb" aria-hidden="true" style="font-size:13px;margin-right:4px"></i>Deurenberg 공식 기반 추정치예요. 정확한 측정은 전문 장비가 필요해요.</div>`;
}
function calcBP(){
  const el=document.getElementById('r3');
  const sys=gv('bp-sys'),dia=gv('bp-dia');
  if(!sys||!dia){el.innerHTML='<div class="empty e3"><i class="ti ti-activity" style="font-size:20px;display:block;margin-bottom:6px" aria-hidden="true"></i>혈압 수치를 입력해 주세요</div>';return;}
  const pp=sys-dia,map=Math.round(dia+pp/3);
  let cat,cls;
  if(sys<90||dia<60){cat='저혈압 의심';cls='b-bl';}
  else if(sys<120&&dia<80){cat='정상';cls='b-gr';}
  else if(sys<130&&dia<80){cat='주의 혈압';cls='b-am';}
  else if(sys<140||dia<90){cat='고혈압 전단계';cls='b-am';}
  else if(sys<160||dia<100){cat='고혈압 1기';cls='b-re';}
  else{cat='고혈압 2기';cls='b-re';}
  el.innerHTML=`<div class="rg">
    <div class="rc rc3"><div class="rc-lbl">혈압</div><div class="rc-val" style="font-size:17px">${sys}/${dia} <span style="font-size:12px;font-weight:400">mmHg</span></div><div class="rc-sub"><span class="badge ${cls}">${cat}</span></div></div>
    <div class="rc rc3"><div class="rc-lbl">평균 동맥압 (MAP)</div><div class="rc-val">${map}</div><div class="rc-sub">mmHg</div></div>
    <div class="rc rc3"><div class="rc-lbl">맥압 (PP)</div><div class="rc-val">${pp}</div><div class="rc-sub">mmHg</div></div>
  </div>
  <div class="guide g3"><div class="guide-hd"><i class="ti ti-info-circle" aria-hidden="true" style="font-size:13px;margin-right:4px"></i>대한고혈압학회 기준</div>
    <div class="grow"><span class="badge b-gr" style="width:90px;text-align:center">정상</span><span class="grow-r">120/80 미만</span></div>
    <div class="grow"><span class="badge b-am" style="width:90px;text-align:center">주의 혈압</span><span class="grow-r">120~129 / 80 미만</span></div>
    <div class="grow"><span class="badge b-am" style="width:90px;text-align:center">전단계</span><span class="grow-r">130~139 / 80~89</span></div>
    <div class="grow"><span class="badge b-re" style="width:90px;text-align:center">1기 고혈압</span><span class="grow-r">140~159 / 90~99</span></div>
    <div class="grow"><span class="badge b-re" style="width:90px;text-align:center">2기 고혈압</span><span class="grow-r">160 / 100 이상</span></div>
  </div>`;
}
function calcCal(){
  const el=document.getElementById('r4');
  const{age,h,w,sex}=G;
  if(!age||!h||!w){el.innerHTML='<div class="empty e4"><i class="ti ti-salad" style="font-size:20px;display:block;margin-bottom:6px" aria-hidden="true"></i>기본 정보를 먼저 입력해 주세요</div>';return;}
  const act=parseFloat(document.getElementById('cal-act').value)||1.55;
  const goal=parseFloat(document.getElementById('cal-goal').value)||1.0;
  const bmr=sex==='male'?88.362+(13.397*w)+(4.799*h)-(5.677*age):447.593+(9.247*w)+(3.098*h)-(4.330*age);
  const target=bmr*act*goal;
  const protein=Math.round(w*1.6),fat=Math.round(target*0.25/9),carbs=Math.max(Math.round((target-protein*4-fat*9)/4),0);
  const gl=document.getElementById('cal-goal').selectedOptions[0].text;
  el.innerHTML=`<div class="rc rc4" style="margin-bottom:8px"><div class="rc-lbl">목표 칼로리 — ${gl}</div><div class="rc-val">${Math.round(target).toLocaleString()} <span style="font-size:13px;font-weight:400">kcal / 일</span></div></div>
  <div class="rg">
    <div class="rc rc4"><div class="rc-lbl">단백질</div><div class="rc-val">${protein}g</div><div class="rc-sub">${Math.round(protein*4).toLocaleString()} kcal</div></div>
    <div class="rc rc4"><div class="rc-lbl">지방</div><div class="rc-val">${fat}g</div><div class="rc-sub">${Math.round(fat*9).toLocaleString()} kcal</div></div>
    <div class="rc rc4"><div class="rc-lbl">탄수화물</div><div class="rc-val">${carbs}g</div><div class="rc-sub">${Math.round(carbs*4).toLocaleString()} kcal</div></div>
  </div>
  <div class="tip tip4"><i class="ti ti-bulb" aria-hidden="true" style="font-size:13px;margin-right:4px"></i>단백질 1.6g/kg, 지방 25%, 잔여를 탄수화물로 배분한 권장 섭취량이에요.</div>`;
}
</script>
